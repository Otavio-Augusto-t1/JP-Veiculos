<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JP Veículos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Conceito: vitrine de concessionária. Preto profundo, vermelho como único acento, estoque sobre fundo branco. */
:root{--bg:#0A0A0A;--panel:#141414;--panel2:#1C1C1C;--line:#2A2A2A;--red:#D90A14;--red2:#F0202B;--white:#FFFFFF;--mut:#A3A3A3;--paper:#F4F4F4;--ink:#0A0A0A;--ink2:#5A5A5A;--ok:#53DB92;--warn:#F2C94C;--fd:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--fb:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--white);font:15px/1.55 var(--fb);-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0A0A0A;z-index:60}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
img{max-width:100%}
:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band>.wrap{padding-block:80px}
.light{background:var(--paper);color:var(--ink);--ring:#F4F4F4}
.redband{background:var(--red);color:#fff}
.disp{font-family:var(--fd);text-transform:uppercase;letter-spacing:.01em;line-height:.95;font-weight:800;text-wrap:balance}
.eyebrow{font:700 12px var(--fb);letter-spacing:.22em;color:var(--red);text-transform:uppercase}
.redband .eyebrow{color:#FFD9DB}
.h2{font-size:clamp(34px,5vw,56px)}
.lead{font-size:18px;color:var(--mut);max-width:560px}
.light .lead{color:var(--ink2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:8px;font-weight:600;font-size:14px;transition:background .15s,transform .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn.red{background:var(--red);color:#fff}.btn.red:hover{background:var(--red2)}
.btn.white{background:#fff;color:#0A0A0A}
.btn.line{box-shadow:inset 0 0 0 1.5px currentColor}
.btn.dark{background:#0A0A0A;color:#fff}
.btn.ghost{background:var(--panel2);color:#fff}
.btn.sm{padding:9px 14px;font-size:13px}.btn.block{width:100%}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* menu */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(10,10,10,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:72px}
.logo{display:flex;align-items:baseline;gap:7px}
.logo b{font:800 34px var(--fd);color:var(--red);line-height:1}
.logo span{font:700 12px var(--fb);letter-spacing:.2em}
.links{display:flex;gap:28px;font-size:14px;font-weight:500;color:#E5E5E5}
.links a{padding-block:6px}
.links a:hover,.links a.on{color:#fff;box-shadow:0 2px 0 var(--red)}
.menubtn{display:none;padding:8px}
@media(max-width:960px){
 .links{display:none;position:absolute;left:0;right:0;top:72px;flex-direction:column;gap:0;background:#0A0A0A;padding:8px max(16px,env(safe-area-inset-left,0px)) 18px;border-bottom:1px solid var(--line)}
 .links a{padding:13px 0}.links a:hover,.links a.on{box-shadow:none;color:var(--red2)}
 .nav.open .links{display:flex}.menubtn{display:block}.nav .cta-d{display:none}}

/* hero */
.hero>.wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;padding-block:72px 88px}
.hero h1{font-size:clamp(54px,8.4vw,112px);margin:18px 0 22px}
.hero h1 em{color:var(--red);font-style:normal}
.trust{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:30px;font-size:13px;font-weight:500;color:#D4D4D4}
.trust span{display:inline-flex;gap:8px;align-items:center}.trust .ic{color:var(--red);width:16px;height:16px}
.vit{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px;position:relative;overflow:hidden;min-width:0}
.vit::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:var(--red)}
.vit .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font:700 12px var(--fb);letter-spacing:.18em;color:var(--mut)}
.art{display:grid;place-items:center;aspect-ratio:16/10;overflow:hidden;position:relative}
.art svg{width:88%;height:auto;max-height:92%}
.art .photo{width:100%;height:100%;object-fit:cover}
.stage{background:radial-gradient(ellipse at 50% 90%,#2E2E2E,#191919 72%);border-radius:18px}
.vit h3{font:700 28px var(--fd);text-transform:uppercase;margin-top:18px}
.vit .pr{font:800 30px var(--fd);color:#fff}
.sw{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.sw button{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(128,128,128,.7);transition:transform .12s}
.sw button:hover{transform:scale(1.12)}
.sw button.on{box-shadow:0 0 0 2px var(--ring,#141414),0 0 0 4px var(--red)}
.sw.lg button{width:34px;height:34px}
.vit .sw{--ring:#141414}
.strip .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding-block:26px;text-align:center}
.strip b{display:block;font:800 22px var(--fd);text-transform:uppercase;letter-spacing:.03em}
.strip small{font-size:13px;color:#FFE1E3}
@media(max-width:960px){.hero>.wrap{grid-template-columns:minmax(0,1fr);gap:40px;padding-block:48px 56px}.strip .wrap{grid-template-columns:repeat(2,1fr)}.band>.wrap{padding-block:56px}}

/* categorias */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px;margin-top:36px}
.cat{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:16px;min-width:0}
.cat .stage{padding:14px 0}
.cat h3{font:800 34px var(--fd);text-transform:uppercase}
.cat p{color:var(--mut)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:22px}
.card{background:#fff;border:1px solid #E3E3E3;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;min-width:0;color:var(--ink);--ring:#fff}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 32px rgba(0,0,0,.12)}
.card .art{background:linear-gradient(#F3F3F3,#E2E2E2)}
.card .body{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}
.tag{font:700 11px var(--fb);letter-spacing:.14em;color:var(--red);text-transform:uppercase}
.card h3{font:700 24px var(--fd);text-transform:uppercase;line-height:1.02}
.meta{font-size:13px;color:var(--ink2)}
.price{font:800 28px var(--fd);letter-spacing:.01em}
.card .actions{display:flex;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.card .actions .btn{flex:1}
.empty{grid-column:1/-1;text-align:center;padding:56px 16px;color:var(--ink2)}

/* como comprar */
.steps5{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:18px;margin-top:40px}
.s5{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.s5 .n{width:44px;height:44px;border-radius:50%;background:var(--red);display:grid;place-items:center;font:800 22px var(--fd)}
.s5 h3{font:700 22px var(--fd);text-transform:uppercase}
.s5 p{font-size:14px;color:var(--mut)}
.s5 .ic{width:28px;height:28px;color:var(--red)}
.step{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding-block:28px}
.step.rev>:first-child{order:2}
.step svg{width:100%;height:auto;display:block;border-radius:16px}
.step h3{font:800 clamp(30px,4vw,44px) var(--fd);text-transform:uppercase;margin:10px 0 12px;line-height:1}
.step p{color:var(--ink2);font-size:17px;max-width:480px}
.light .step .eyebrow{display:block}
@media(max-width:860px){.step{grid-template-columns:minmax(0,1fr);gap:20px}.step.rev>:first-child{order:0}}
.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:20px;margin-top:32px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;min-width:0}
.box h3{font:700 24px var(--fd);text-transform:uppercase;margin-bottom:8px}
.box p,.box li{color:var(--mut);font-size:14px}
.box ul{margin:0;padding-left:18px;display:grid;gap:6px}
.lightbox{background:#fff;border:1px solid #E3E3E3;color:var(--ink)}
.lightbox p,.lightbox li{color:var(--ink2)}
details{background:#fff;border:1px solid #E3E3E3;border-radius:12px;padding:16px 18px}
details+details{margin-top:10px}
summary{font-weight:600;cursor:pointer;color:var(--ink)}
details p{margin-top:10px;color:var(--ink2)}

/* detalhe */
.crumb{font-size:13px;color:var(--mut);margin-bottom:22px}.crumb a:hover{color:#fff}
.det{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:start}
@media(max-width:960px){.det{grid-template-columns:minmax(0,1fr)}}
.det .stage{padding:8px}
.det .stage .art{aspect-ratio:16/10}
.det h1{font-size:clamp(38px,5vw,60px);margin:8px 0 6px}
.det .bigprice{font:800 44px var(--fd);margin:10px 0 18px}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:18px 0}
.specs div{background:var(--panel);padding:12px 14px}
.specs small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.specs b{font-weight:600}
.sim{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:20px}
.sim .out{font:800 38px var(--fd);color:#fff;margin-top:10px}
.sim .out small{font:500 13px var(--fb);color:var(--mut)}
.note{font-size:12px;color:var(--mut);margin-top:8px}
.badge-sold{display:inline-block;background:var(--red);color:#fff;font:700 12px var(--fb);letter-spacing:.14em;padding:4px 10px;border-radius:6px;text-transform:uppercase}

/* formularios */
.f{display:grid;gap:6px;min-width:0}
.f label,.lab{font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.07em;text-transform:uppercase}
input,select,textarea{background:#0F0F0F;border:1px solid #333;border-radius:8px;padding:11px 12px;color:#fff;font:inherit;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
input[type=color]{padding:2px;height:42px;width:56px}
input[type=checkbox]{width:auto}
.light input,.light select{background:#fff;color:#0A0A0A;border-color:#D4D4D4}
.light .f label{color:var(--ink2)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.filters{display:flex;flex-wrap:wrap;gap:14px;align-items:end;margin-bottom:28px}
.filters .grow{flex:1;min-width:220px}
.seg{display:flex;border-radius:10px;overflow:hidden;border:1px solid #D4D4D4;background:#fff}
.seg button{padding:11px 16px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.okbox{background:rgba(83,219,146,.1);border:1px solid rgba(83,219,146,.35);color:var(--ok);padding:16px;border-radius:12px;font-weight:600}
.mapbox{background:var(--panel);border:1px solid var(--line);border-radius:20px;min-height:300px;display:grid;place-items:center;overflow:hidden}
.mapbox svg{width:100%;height:100%;display:block}
.loc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:32px;align-items:stretch}
.info{display:grid;gap:14px;align-content:center}
.info div{display:flex;gap:12px;align-items:flex-start;color:#D4D4D4}.info .ic{color:var(--red);margin-top:2px}
footer{background:#050505;border-top:1px solid var(--line)}
footer .wrap{padding-block:48px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:32px;color:var(--mut);font-size:14px}
footer h4{margin:0 0 10px;color:#fff;font:700 13px var(--fb);letter-spacing:.14em;text-transform:uppercase}
footer a:hover{color:#fff}
footer .legal{grid-column:1/-1;border-top:1px solid var(--line);padding-top:20px;font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#0A0A0A;padding:12px 18px;border-radius:10px;font-weight:600;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px)}

/* admin */
.adm{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:#050505;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.side .logo{padding:0 10px 18px}
.side a,.side button{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 12px;border-radius:8px;font-size:14px;font-weight:500;color:#D4D4D4;text-align:left;width:100%}
.side a:hover,.side button:hover{background:var(--panel2);color:#fff}
.side a.on{background:var(--red);color:#fff}
.side .sp{flex:1}
.cnt{background:var(--red);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 8px}
.main{padding:32px max(20px,env(safe-area-inset-right,0px)) 64px 32px;min-width:0}
.main h1{font:800 clamp(34px,4vw,48px) var(--fd);text-transform:uppercase;margin-bottom:6px}
.main .sub{color:var(--mut);margin-bottom:26px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px;margin-bottom:24px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.tile small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.tile b{display:block;font:800 36px var(--fd);margin-top:6px}
.tile.hot{border-color:var(--red)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.panel h3{font:700 20px var(--fd);text-transform:uppercase;margin-bottom:14px}
.bar{display:grid;grid-template-columns:90px 1fr 28px;gap:10px;align-items:center;font-size:13px;margin-block:8px}
.bar i{display:block;height:12px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.6)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:780px;font-size:14px}
th{background:var(--panel);text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding:12px 14px;font-weight:600}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
.mini{display:flex;gap:12px;align-items:center}
.mini .art{width:84px;aspect-ratio:16/10;background:#1C1C1C;border-radius:8px;flex:none}
.mini .art svg{width:92%}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:rgba(83,219,146,.14);color:var(--ok)}
.p-bad{background:rgba(217,10,20,.2);color:#FF7C82}
.p-new{background:rgba(242,201,76,.14);color:var(--warn)}
.dots{display:flex;gap:4px}.dots i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(128,128,128,.7)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.ib{padding:7px 10px;border-radius:8px;background:var(--panel2);font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.ib:hover{background:#2a2a2a}.ib.danger{background:rgba(217,10,20,.2);color:#FF7C82}
.star{color:#555}.star.on{color:var(--warn)}.star .ic{fill:none}.star.on .ic{fill:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;gap:8px;align-items:center;padding:7px 12px;border:1px solid #333;border-radius:99px;font-size:13px;cursor:pointer}
.chip i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(128,128,128,.7)}
.chip:has(input:checked){border-color:var(--red);background:rgba(217,10,20,.12)}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip:has(input:focus-visible){outline:2px solid var(--red2)}
.prev{width:100%;max-width:320px;aspect-ratio:16/10;border-radius:10px;object-fit:cover;background:#1C1C1C;display:block}
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login .box{width:100%;max-width:400px}
.err{color:#FF7C82;font-size:13px;min-height:18px}
.lead-card{border-top:1px solid var(--line);padding:14px 0;display:grid;gap:6px}
.lead-card:first-child{border-top:0}
@media(max-width:860px){
 .adm{grid-template-columns:minmax(0,1fr)}
 .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px max(12px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line)}
 .side .logo{width:100%;padding-bottom:6px}.side a,.side button{width:auto}.side .sp{display:none}
 .main{padding:24px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div id="app"></div>
<div id="toast" class="toast" hidden></div>

var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var BRL=function(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0})};
var KM=function(n){return Number(n||0).toLocaleString('pt-BR')+' km'};
var PALETTE=[{n:'Preto',h:'#1A1A1A'},{n:'Branco',h:'#F2F2F2'},{n:'Prata',h:'#B9BDC4'},{n:'Grafite',h:'#4B5058'},{n:'Vermelho',h:'#D90A14'},{n:'Azul',h:'#1F4FA8'},{n:'Verde',h:'#1F7A4D'},{n:'Amarelo',h:'#E5B400'},{n:'Laranja',h:'#E8650A'}];

function seed(){return{
 cfg:{nome:'JP Veículos',zap:'',end:'Rua da Loja, 000, Centro',hor:'Segunda a sexta, 8h às 18h. Sábado, 8h às 13h',taxa:1.99,senha:'admin123'},
 vehicles:[

  {id:2,tipo:'Carro',marca:'Toyota',modelo:'Corolla XEi',ano:2021,km:52000,preco:119900,cambio:'Automático',comb:'Flex',cores:P('Branco','Prata','Grafite'),destaque:true,status:'Disponível',desc:'Conforto e economia, com manual e chave reserva. Laudo cautelar aprovado.'},

function contatosHTML(){var a=S.leads.slice().reverse();
 return '<h1>Contatos</h1><p class="sub">Pedidos enviados pelos formulários do site. Ficam salvos neste navegador.</p>'+(a.length?'<div class="panel">'+a.map(function(l){var dt=new Date(l.data).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});var num=String(l.tel).replace(/\D/g,'');return '<div class="lead-card"><div class="row" style="justify-content:space-between"><b>'+esc(l.nome)+'</b><span class="pill '+(l.status==='Novo'?'p-new':'p-ok')+'">'+l.status+'</span></div><span style="color:var(--mut)">'+dt+' • '+esc(l.veiculo)+'</span><span>'+esc(l.tel)+'</span>'+(l.msg?'<span style="color:#D4D4D4">'+esc(l.msg)+'</span>':'')+'<div class="acts" style="margin-top:6px"><a class="ib" target="_blank" rel="noopener" href="https://wa.me/'+(num.length<=11?'55'+num:num)+'">'+ic('chat')+' Responder</a><button class="ib" data-a="lead-status" data-id="'+l.id+'">'+(l.status==='Novo'?'Marcar atendido':'Marcar como novo')+'</button><button class="ib danger" data-a="lead-del" data-id="'+l.id+'">'+ic('trash')+'</button></div></div>'}).join('')+'</div>':'<div class="panel"><p style="color:var(--mut)">Nenhum contato ainda. Quando alguém preencher o formulário no site, ele aparece aqui.</p></div>')}
function configHTML(){var c=S.cfg;return '<h1>Configurações</h1><p class="sub">Dados que aparecem no site.</p><form data-form="config" style="display:grid;gap:16px;max-width:720px"><div class="formgrid"><div class="f"><label for="cn1">Nome da loja</label><input id="cn1" name="nome" value="'+esc(c.nome)+'"></div><div class="f"><label for="cz">WhatsApp (com DDD)</label><input id="cz" name="zap" inputmode="tel" placeholder="5516999999999" value="'+esc(c.zap)+'"></div></div><div class="f"><label for="ce">Endereço</label><input id="ce" name="end" value="'+esc(c.end)+'"></div><div class="f"><label for="ch">Horário de atendimento</label><input id="ch" name="hor" value="'+esc(c.hor)+'"></div><div class="formgrid"><div class="f"><label for="ctx">Taxa do simulador (% ao mês)</label><input id="ctx" name="taxa" type="number" step="0.01" min="0" value="'+c.taxa+'"></div><div class="f"><label for="cs">Senha do painel</label><input id="cs" name="senha" type="text" value="'+esc(c.senha)+'"></div></div><p class="note">Informe o WhatsApp com código do país e DDD, só números. A senha protege o painel apenas neste navegador; para publicar de verdade, o login precisa ficar no servidor.</p><div class="row"><button class="btn red" type="submit">Salvar configurações</button></div></form><div class="panel" style="margin-top:28px;max-width:720px"><h3>Dados de exemplo</h3><p style="color:var(--mut);margin-bottom:12px">Restaura os oito veículos de exemplo e apaga os cadastros e contatos feitos neste navegador.</p>'+(state.creset?'<button class="btn red sm" data-a="reset-yes">Confirmar: apagar tudo e restaurar</button>':'<button class="btn ghost sm" data-a="reset">Restaurar dados de exemplo</button>')+'</div>'}

function adminHTML(v){if(!state.auth)return loginHTML();
 var inner;if(v==='dash')inner=dashHTML();else if(v==='veiculos')inner=veiculosHTML();else if(v==='novo')inner=formHTML(0);else if(v.indexOf('editar-')===0)inner=formHTML(+v.slice(7));else if(v==='contatos')inner=contatosHTML();else if(v==='config')inner=configHTML();else inner=dashHTML();
 return adminShell(v,inner)}

/* roteador */
function parse(){var h=(location.hash||'#inicio').slice(1);if(h.indexOf('veiculo-')===0)return{p:'veiculo',id:+h.slice(8)};if(h==='admin')return{p:'admin',v:'dash'};if(h.indexOf('admin-')===0)return{p:'admin',v:h.slice(6)};return{p:h||'inicio'}}
function render(){var r=parse();var app=$('#app');var html;
 document.title=r.p==='admin'?'JP Veículos • Admin':'JP Veículos';
 if(r.p==='admin')html=adminHTML(r.v);
 else if(r.p==='estoque')html=shell(estoqueHTML(),'estoque');
 else if(r.p==='veiculo')html=shell(detalheHTML(r.id),'estoque');
 else if(r.p==='como-comprar')html=shell(comoHTML(),'como-comprar');
 else if(r.p==='contato')html=shell(contatoHTML(),'contato');
 else html=shell(homeHTML(),'inicio');
 app.innerHTML=html;state.foto=undefined;
 if(r.p==='estoque')updateGrid();
 if(r.p==='veiculo')simUpdate()}
function rerender(){var y=window.scrollY;render();window.scrollTo(0,y)}

function readPhoto(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,900/Math.max(im.width,im.height));var cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.74))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

/* eventos */
document.addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(!t)return;var a=t.dataset.a,id=+t.dataset.id;
 if(a==='menu'){$('#nav').classList.toggle('open');return}
 if(a==='color'){setColor(id,+t.dataset.i);return}
 if(a==='hero-next'){state.hero++;rerender();return}
 if(a==='cat'){state.f.tipo=t.dataset.t;state.f.cor='Todas';state.f.q='';return}
 if(a==='tipo'){state.f.tipo=t.dataset.t;$$('.seg button').forEach(function(b){b.classList.toggle('on',b.dataset.t===state.f.tipo)});updateGrid();return}
 if(a==='logout'){state.auth=false;try{sessionStorage.removeItem('jpv_auth')}catch(x){}location.hash='#inicio';return}
 if(a==='dest'){var v=byId(id);v.destaque=!v.destaque;save();rerender();return}
 if(a==='status'){var w=byId(id);w.status=w.status==='Disponível'?'Vendido':'Disponível';save();rerender();toast(w.status==='Vendido'?'Marcado como vendido.':'Veículo reativado.');return}
 if(a==='del'){state.cdel=id;rerender();return}
 if(a==='del-yes'){S.vehicles=S.vehicles.filter(function(x){return x.id!==id});state.cdel=null;save();rerender();toast('Veículo excluído.');return}
 if(a==='lead-status'){var l=S.leads.filter(function(x){return x.id===id})[0];l.status=l.status==='Novo'?'Atendido':'Novo';save();rerender();return}
 if(a==='lead-del'){S.leads=S.leads.filter(function(x){return x.id!==id});save();rerender();return}
 if(a==='reset'){state.creset=true;rerender();return}
 if(a==='reset-yes'){S=seed();state.creset=false;save();rerender();toast('Dados de exemplo restaurados.');return}
 if(a==='rmfoto'){state.foto=null;var p=$('#fprev');if(p)p.innerHTML='<p class="note">A foto será removida ao salvar.</p>';return}
 if(a==='addcolor'){var n=$('#cn').value.trim(),h=$('#cc').value;if(!n){toast('Dê um nome para a cor.');return}
  var ex=$$('#chips input').filter(function(x){return x.value.toLowerCase()===n.toLowerCase()})[0];if(ex){ex.checked=true;return}
  var lb=document.createElement('label');lb.className='chip';lb.innerHTML='<input type="checkbox" name="cor" checked><i></i>'+esc(n);var inp=lb.querySelector('input');inp.value=n;inp.dataset.h=h;lb.querySelector('i').style.background=h;$('#chips').appendChild(lb);$('#cn').value='';return}
});
document.addEventListener('submit',function(e){var f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();var k=f.dataset.form,fd=new FormData(f);
 if(k==='login'){if(fd.get('pw')!==undefined){}var pw=$('#pw').value;if(pw===S.cfg.senha){state.auth=true;try{sessionStorage.setItem('jpv_auth','1')}catch(x){}rerender()}else{$('#lerr').textContent='Senha incorreta.'}return}
 if(k==='lead'){var id=+f.dataset.id,v=id?byId(id):null;var c=v&&v.cores[state.sel[id]||0];
  S.leads.push({id:Date.now(),nome:String(fd.get('nome')).trim(),tel:String(fd.get('tel')).trim(),msg:String(fd.get('msg')||'').trim(),veiculo:v?v.marca+' '+v.modelo+' '+v.ano+(c?' ('+c.n+')':''):'Contato geral',data:new Date().toISOString(),status:'Novo'});save();
  f.outerHTML='<div class="okbox">Contato registrado. A '+esc(S.cfg.nome)+' vai retornar em breve.</div>';return}
 if(k==='config'){S.cfg.nome=String(fd.get('nome')).trim()||'JP Veículos';S.cfg.zap=String(fd.get('zap')).trim();S.cfg.end=String(fd.get('end')).trim();S.cfg.hor=String(fd.get('hor')).trim();S.cfg.taxa=+fd.get('taxa')||0;S.cfg.senha=String(fd.get('senha')).trim()||'admin123';if(save())toast('Configurações salvas.');return}
 if(k==='vehicle'){var vid=+f.dataset.id;var cores=$$('#chips input:checked').map(function(x){return{n:x.value,h:x.dataset.h}});
  if(!cores.length){$('#ferr').textContent='Marque pelo menos uma cor.';return}
  var o={tipo:fd.get('tipo'),marca:String(fd.get('marca')).trim(),modelo:String(fd.get('modelo')).trim(),ano:+fd.get('ano'),km:+fd.get('km')||0,preco:+fd.get('preco'),cambio:fd.get('cambio'),comb:fd.get('comb'),desc:String(fd.get('desc')||'').trim(),cores:cores,destaque:!!fd.get('destaque'),status:fd.get('status')};
  if(!o.marca||!o.modelo||!o.preco){$('#ferr').textContent='Preencha marca, modelo e preço.';return}
  if(vid){var cur=byId(vid);Object.keys(o).forEach(function(k2){cur[k2]=o[k2]});if(state.foto===null)delete cur.foto;else if(state.foto)cur.foto=state.foto}
  else{o.id=S.vehicles.reduce(function(m,x){return Math.max(m,x.id)},0)+1;if(state.foto)o.foto=state.foto;S.vehicles.push(o)}
  state.sel={};if(save()){toast('Veículo salvo.');location.hash='#admin-veiculos'}return}
});
function onInput(e){var t=e.target;var i=t.dataset&&t.dataset.i;if(!i)return;
 if(i==='q'||i==='cor'||i==='ord'){state.f[i]=t.value;updateGrid()}
 else if(i==='sim')simUpdate();
 else if(i==='aq'){$('#vrows').innerHTML=rowsHTML(t.value)}
 else if(i==='foto'&&e.type==='change'&&t.files[0]){readPhoto(t.files[0]).then(function(d){state.foto=d;$('#fprev').innerHTML='<img class="prev" src="'+d+'" alt="Nova foto">'}).catch(function(){toast('Não foi possível ler essa imagem.')})}}
document.addEventListener('input',onInput);document.addEventListener('change',onInput);
window.addEventListener('hashchange',function(){state.cdel=null;state.creset=false;render();window.scrollTo(0,0)});
render();
})();
</script>

</html>
